<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensajes — Panel</title>
  <!-- Que no salga en buscadores. No es lo que la protege (eso es la RLS de
       Supabase), pero no hay razón para que esté indexada. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#09090b" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #09090b; --surface: #141417; --surface-2: #1b1b1f; --border: #26262c;
      --text: #f4f4f6; --muted: #9a9aa3; --faint: #6a6a73; --accent: #5ad67d;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 22px 80px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
    .quien { font-size: 12px; color: var(--faint); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      padding: 9px 16px; border-radius: 9px; font: inherit; font-size: 13.5px; font-weight: 700;
      border: 1px solid transparent; transition: border-color .18s, transform .18s;
    }
    .btn-primary { background: var(--text); color: #0a0a0b; }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-mini { padding: 5px 11px; font-size: 12px; font-weight: 600; }

    /* ── Entrar ── */
    #entrar { max-width: 380px; margin: 70px auto 0; }
    #entrar h2 { font-size: 16px; margin-bottom: 6px; }
    #entrar .pista { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    label { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label span {
      font-size: 11px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--faint);
    }
    input {
      font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; width: 100%;
    }
    input:focus { outline: none; border-color: var(--accent); }

    .aviso { font-size: 13px; margin-top: 10px; min-height: 1.2em; }
    .aviso.mal { color: #e57b63; }
    .aviso.ok { color: var(--accent); }

    /* ── Lista ── */
    .barra-filtros { display: flex; gap: 8px; align-items: center; margin: 22px 0 14px; flex-wrap: wrap; }
    .cuenta { font-size: 12px; color: var(--faint); margin-left: auto; }

    .lista { display: flex; flex-direction: column; gap: 12px; }
    .msg { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .msg.nuevo { border-color: rgba(90, 214, 125, .38); }
    .msg-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .msg-asunto { font-size: 15px; font-weight: 700; }
    .punto {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      flex: 0 0 auto; align-self: center;
    }
    .msg-de { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    .msg-de a { color: var(--accent); text-decoration: none; }
    .msg-de a:hover { text-decoration: underline; }
    .msg-fecha { font-size: 11.5px; color: var(--faint); margin-left: auto; white-space: nowrap; }
    .msg-cuerpo {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .msg-pie { margin-top: 14px; display: flex; gap: 8px; }

    .vacio { color: var(--faint); text-align: center; padding: 40px 0; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- Entrar -->
    <section id="entrar" class="card">
      <h2>Mensajes de la web</h2>
      <p class="pista">Entra con tu cuenta de GymSpeak. Solo las cuentas marcadas como administrador ven algo.</p>
      <form id="formEntrar">
        <label>
          <span>Correo</span>
          <input type="email" id="email" autocomplete="username" required />
        </label>
        <label>
          <span>Contraseña</span>
          <input type="password" id="clave" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary" type="submit" id="btnEntrar">Entrar</button>
        <p class="aviso" id="avisoEntrar" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- Panel -->
    <div id="panel" hidden>
      <header>
        <div>
          <h1>Mensajes de la web</h1>
          <p class="quien" id="quien"></p>
        </div>
        <button class="btn btn-ghost" type="button" id="btnSalir">Salir</button>
      </header>

      <div class="barra-filtros">
        <button class="btn btn-ghost btn-mini" type="button" data-filtro="sin" aria-pressed="true">Sin leer</button>
        <button class="btn btn-ghost btn-mini" type="button" data-filtro="todos" aria-pressed="false">Todos</button>
        <button class="btn btn-ghost btn-mini" type="button" id="btnRecargar">Recargar</button>
        <span class="cuenta" id="cuenta"></span>
      </div>

      <p class="aviso" id="avisoPanel" role="status" aria-live="polite"></p>
      <div class="lista" id="lista"></div>
      <p class="vacio" id="vacio" hidden>No hay mensajes aquí.</p>
    </div>

  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
